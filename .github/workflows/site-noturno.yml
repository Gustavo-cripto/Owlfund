# Todas as noites, o site A CORRER em produção: páginas públicas nas 4 línguas,
# todos os links internos, APIs públicas e fontes externas (scripts/verificar-site.mjs),
# mais a API pública e o servidor MCP (scripts/verificar-api.mjs), e a auditoria
# das dependências de produção (scripts/auditar-dependencias.mjs), que só lê o
# package-lock.json e não precisa de instalar nada.
# Se falhar: o GitHub envia email ao dono do repositório; se existirem os
# segredos TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID no repositório, avisa também
# no Telegram (opcional — sem eles o passo é saltado).
name: site-noturno

on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC, antes do dia começar em Portugal
  workflow_dispatch:

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verificar chainfolioai.com
        # Com os segredos, o script avisa no Telegram quando o /api/status vem
        # "degradado" (CoinGecko em 429, snapshots parados) sem falhar o passo.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/verificar-site.mjs
      # A API e o MCP não aparecem na verificação de páginas: um endpoint pode
      # responder 200 com tudo vazio (aconteceu a 18 set 2026 no /api/v1/global).
      # Este passo percorre a lista que o próprio site publica, por isso cobre
      # automaticamente endpoints novos.
      - name: Verificar API e MCP
        if: always()
        run: node scripts/verificar-api.mjs
      - name: Avisar no Telegram (se configurado)
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "Sem segredos do Telegram — só email do GitHub."; exit 0; fi
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=🔴 Verificação noturna do site FALHOU. Ver: $RUN_URL" >/dev/null

  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Falha com um aviso crítico/alto numa dependência de produção que não
      # esteja justificado na lista de exceções do script (cada exceção tem
      # motivo e data de validade).
      - name: Auditar dependências de produção
        run: AUDIT_RESUMO="$RUNNER_TEMP/auditoria.txt" node scripts/auditar-dependencias.mjs
      - name: Avisar no Telegram (se configurado)
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then echo "Sem segredos do Telegram — só email do GitHub."; exit 0; fi
          RESUMO=$(head -c 1500 "$RUNNER_TEMP/auditoria.txt" 2>/dev/null || true)
          [ -n "$RESUMO" ] || RESUMO="(sem resumo: ver o registo)"
          curl -s -X POST "https://api.telegram.org/bot$TOKEN/sendMessage" \
            --data-urlencode "chat_id=$CHAT" \
            --data-urlencode "text=🔴 Auditoria noturna das dependências FALHOU (aviso crítico/alto novo):
          $RESUMO
          Ver: $RUN_URL" >/dev/null
